<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loading...</title>
    <style>
      :root {
        --bg: #fdfcfb;
        --fg: #14161b;
        --circle: #3b4248;
        --shadow: rgba(0, 0, 0, 0.26);
        --title-size: clamp(1.85rem, 4.2vw, 5.2rem);
      }
      html.dark {
        --bg: #0b0d12;
        --fg: #f4f5f7;
        --circle: #9aa5b4;
        --shadow: rgba(0, 0, 0, 0.62);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        -webkit-font-smoothing: antialiased;
      }

      /* Two seamless background halves that part from the middle */
      .bg-half {
        position: fixed;
        top: 0;
        bottom: 0;
        width: 50.4%;
        background: var(--bg);
        z-index: 1;
        will-change: transform;
        transform: translate3d(0, 0, 0);
        backface-visibility: hidden;
      }
      .bg-left {
        left: 0;
      }
      .bg-right {
        right: 0;
      }

      .title {
        position: absolute;
        z-index: 2;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        color: var(--fg);
        font-family: "Plus Jakarta Sans", "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        font-size: var(--title-size);
        font-weight: 800;
        letter-spacing: 0.04em;
        opacity: 0;
        transform: scale3d(0.86, 0.86, 1);
        will-change: transform, opacity;
        animation: title-in 0.52s 0.08s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .title span {
        display: inline-block;
        will-change: transform, opacity;
      }
      .title.sweep span {
        position: absolute;
        display: grid;
        place-items: center;
        white-space: pre;
      }
      .title .glyph {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        will-change: transform, opacity;
        transition: opacity 0.36s ease, transform 0.36s ease;
      }
      .title .slash-glyph {
        opacity: 0;
        transform: scale3d(0.7, 0.7, 1);
      }
      .title .slash.is-slash .letter-a {
        opacity: 0;
        transform: scale3d(0.7, 0.7, 1);
      }
      .title .slash.is-slash .slash-glyph {
        opacity: 1;
        transform: scale3d(1, 1, 1);
      }

      .sweep-circle {
        position: fixed;
        z-index: 4;
        isolation: isolate;
        border-radius: 50%;
        background: var(--circle);
        opacity: 0;
        transform: scale3d(0.65, 0.65, 1);
        pointer-events: none;
        will-change: transform, opacity;
        backface-visibility: hidden;
      }
      .sweep-circle::before {
        content: "";
        position: absolute;
        z-index: -1;
        left: -22%;
        top: 80%;
        width: 144%;
        height: 36%;
        border-radius: 50%;
        background: radial-gradient(closest-side, var(--shadow) 0%, transparent 100%);
      }

      @keyframes title-in {
        to {
          opacity: 1;
          transform: scale3d(1, 1, 1);
        }
      }
    </style>
    <script>
      (function () {
        let isDark = false;
        try {
          const saved = localStorage.getItem("akash_portfolio_theme") || localStorage.getItem("theme");
          isDark = saved === "dark";
          if (window.parent && window.parent !== window && window.parent.document && window.parent.document.body) {
            isDark = window.parent.document.body.classList.contains("dark-theme") || isDark;
          }
        } catch (e) {}
        if (isDark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div class="bg-half bg-left" id="bgLeft"></div>
    <div class="bg-half bg-right" id="bgRight"></div>

    <script>
      (function () {
        const bgLeft = document.getElementById("bgLeft");
        const bgRight = document.getElementById("bgRight");

        // Non-blocking background warm-up for critical hero assets only (never blocks preload completion)
        try {
          ["assets/akash-bgless-professional.png", "assets/bg.png"].forEach(function (url) {
            const img = new Image();
            img.decoding = "async";
            img.src = url;
          });
        } catch (e) {}

        // Build title characters
        const title = document.createElement("h1");
        title.className = "title";
        [..."ARCHITECTURE"].forEach(function (ch, i) {
          const span = document.createElement("span");
          span.textContent = ch;
          span.className = i === 0 ? "slash" : "letter";
          title.appendChild(span);
        });
        document.body.appendChild(title);

        let notifiedComplete = false;
        function notifyComplete() {
          if (notifiedComplete) return;
          notifiedComplete = true;
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage("preload-complete", "*");
            } else {
              bgLeft.remove();
              bgRight.remove();
              title.remove();
            }
          } catch (e) {}
        }

        // 1. Lock character positions and morph 'A' -> '/'
        setTimeout(function () {
          const slash = title.querySelector(".slash");
          const titleRect = title.getBoundingClientRect();
          [...title.querySelectorAll("span")].forEach(function (el) {
            const r = el.getBoundingClientRect();
            el.style.left = (r.left - titleRect.left) + "px";
            el.style.top = (r.top - titleRect.top) + "px";
            el.style.width = r.width + "px";
            el.style.height = r.height + "px";
          });
          title.classList.add("sweep");

          const letterA = document.createElement("span");
          letterA.className = "glyph letter-a";
          letterA.textContent = "A";

          const slashGlyph = document.createElement("span");
          slashGlyph.className = "glyph slash-glyph";
          slashGlyph.textContent = "/";

          slash.replaceChildren(letterA, slashGlyph);
          requestAnimationFrame(function () {
            slash.classList.add("is-slash");
          });

          // 2. Sweep '/' across the word and clear letters with GPU-only transforms
          setTimeout(function () {
            const slashRect = slash.getBoundingClientRect();
            const glyphRect = slashGlyph.getBoundingClientRect();
            const finalSlashW = glyphRect.width * 1.5;
            const circleSize = glyphRect.height * 1.5 * 0.75;
            const pairGap = Math.max(8, finalSlashW * 0.18);
            const groupWidth = finalSlashW + pairGap + circleSize;

            const targetX = window.innerWidth / 2 - groupWidth / 2 + finalSlashW / 2;
            const deltaX = targetX - (slashRect.left + slashRect.width / 2);
            const deltaY = window.innerHeight / 2 - (glyphRect.top + glyphRect.height / 2);
            const duration = 740;
            const speed = Math.abs(deltaX) / duration;

            const sweepAnims = [
              slash.animate(
                [
                  { transform: "translate3d(0, 0, 0)" },
                  { transform: "translate3d(" + deltaX + "px, " + deltaY + "px, 0)" }
                ],
                { duration: duration, easing: "linear", fill: "forwards" }
              ),
              slashGlyph.animate(
                [
                  { transform: "scale3d(1, 1, 1)" },
                  { transform: "scale3d(1.5, 1.5, 1)" }
                ],
                { duration: duration, easing: "linear", fill: "forwards" }
              )
            ];

            title.querySelectorAll(".letter").forEach(function (letter) {
              const rect = letter.getBoundingClientRect();
              const gap = Math.max(0, rect.left - slashRect.right);
              const meetDist = gap / 2;
              const time =
                speed === 0
                  ? gap / 0.2
                  : meetDist <= Math.abs(deltaX)
                    ? meetDist / speed
                    : duration + (gap - 2 * Math.abs(deltaX)) / speed;
              const travel =
                speed === 0
                  ? gap
                  : Math.min(gap, Math.abs(deltaX) + speed * Math.max(0, time - duration));
              const fadeAt = Math.max(0, time - 190);

              const anim = letter.animate(
                [
                  { transform: "translate3d(0, 0, 0) scale3d(1, 1, 1)", opacity: 1, offset: 0 },
                  { transform: "translate3d(" + (-speed * fadeAt) + "px, 0, 0) scale3d(1, 1, 1)", opacity: 1, offset: time ? fadeAt / time : 0 },
                  { transform: "translate3d(" + (-travel) + "px, 0, 0) scale3d(0.72, 0.72, 1)", opacity: 0, offset: 1 }
                ],
                { duration: Math.max(1, time), easing: "linear", fill: "forwards" }
              );
              anim.onfinish = function () { letter.remove(); };
              sweepAnims.push(anim);
            });

            // 3. Appear circle beside '/', hold a brief pause, then crossover & part the screen
            Promise.all(sweepAnims.map(function (a) { return a.finished; })).then(function () {
              const bounds = slashGlyph.getBoundingClientRect();
              const diameter = bounds.height * 0.75;
              const circle = document.createElement("div");
              circle.className = "sweep-circle";
              circle.style.width = diameter + "px";
              circle.style.height = diameter + "px";
              circle.style.left = (bounds.right + pairGap) + "px";
              circle.style.top = (bounds.top + bounds.height / 2 - diameter / 2) + "px";
              document.body.appendChild(circle);

              const circleAppear = circle.animate(
                [
                  { opacity: 0, transform: "scale3d(0.6, 0.6, 1)" },
                  { opacity: 1, transform: "scale3d(1, 1, 1)" }
                ],
                { duration: 210, easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "forwards" }
              );

              circleAppear.finished.then(function () {
                setTimeout(function () {
                  const exitDuration = 880;
                  const easing = "cubic-bezier(0.65, 0, 0.35, 1)";
                  const circleBounds = circle.getBoundingClientRect();

                  const circleLeftTravel = -(circleBounds.right + diameter + 24);
                  const slashRightTravel = window.innerWidth - bounds.left + bounds.width + 24;

                  // Notify parent slightly before curtains finish parting so hero entrance starts seamlessly
                  setTimeout(function () {
                    try {
                      if (window.parent && window.parent !== window) {
                        window.parent.postMessage("preload-parting", "*");
                      }
                    } catch (e) {}
                  }, 320);

                  Promise.all([
                    bgLeft.animate(
                      [{ transform: "translate3d(0, 0, 0)" }, { transform: "translate3d(-100%, 0, 0)" }],
                      { duration: exitDuration, easing: easing, fill: "forwards" }
                    ).finished,
                    bgRight.animate(
                      [{ transform: "translate3d(0, 0, 0)" }, { transform: "translate3d(100%, 0, 0)" }],
                      { duration: exitDuration, easing: easing, fill: "forwards" }
                    ).finished,
                    circle.animate(
                      [
                        { transform: "translate3d(0, 0, 0) scale3d(1, 1, 1)", opacity: 1 },
                        { transform: "translate3d(" + circleLeftTravel + "px, 0, 0) scale3d(1, 1, 1)", opacity: 0.95 }
                      ],
                      { duration: exitDuration, easing: easing, fill: "forwards" }
                    ).finished,
                    slash.animate(
                      [
                        { transform: "translate3d(" + deltaX + "px, " + deltaY + "px, 0)", opacity: 1 },
                        { transform: "translate3d(" + (deltaX + slashRightTravel) + "px, " + deltaY + "px, 0)", opacity: 0.95 }
                      ],
                      { duration: exitDuration, easing: easing, fill: "forwards" }
                    ).finished
                  ]).then(notifyComplete).catch(notifyComplete);
                }, 320);
              });
            }).catch(notifyComplete);
          }, 340);
        }, 640);

        // Guaranteed non-blocking safety completion
        setTimeout(notifyComplete, 4200);
      })();
    </script>
  </body>
</html>
